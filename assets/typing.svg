<svg width="850" height="50" viewBox="0 0 850 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .typewriter-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        font-weight: 600;
        fill: #c084fc;
      }
      .cursor {
        fill: #38bdf8;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="50" rx="10" fill="#0d0b18" fill-opacity="0.7" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Prompt Icon -->
  <text x="25" y="31" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#a855f7">❯</text>

  <!-- Animated Text String -->
  <g transform="translate(50, 31)">
    <text class="typewriter-text" fill="url(#textGrad)">
      <animate attributeName="opacity" values="1;1;1" dur="10s" repeatCount="indefinite"/>
      <animateItem>Machine Learning Engineer • Full Stack Developer • Computer Vision Specialist</animateItem>
      Machine Learning Engineer • Full Stack Developer • Computer Vision Specialist
    </text>
  </g>

  <!-- Blinking Cursor -->
  <rect x="790" y="16" width="10" height="20" class="cursor" rx="2"/>
</svg>
