<svg width="880" height="250" viewBox="0 0 880 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="anBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080710"/>
      <stop offset="50%" stop-color="#0d0b1a"/>
      <stop offset="100%" stop-color="#050409"/>
    </linearGradient>

    <linearGradient id="anBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>

    <!-- Language Gradients -->
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#eab308"/><stop offset="100%" stop-color="#fde047"/></linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#c084fc"/></linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .sec-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 14px; fill: #c084fc; letter-spacing: 1px; }
      .stat-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .stat-lbl { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; fill: #94a3b8; }
      .lang-txt { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      .lang-pct { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; fill: #c084fc; }
    </style>
  </defs>

  <!-- Main Card Container -->
  <rect width="880" height="250" rx="14" fill="url(#anBg)" stroke="url(#anBorder)" stroke-width="1.5"/>

  <!-- Left Half: GitHub Streak & Contribution Analytics -->
  <g transform="translate(25, 25)">
    <text class="sec-title">🔥 GITHUB STREAK &amp; ACTIVITY</text>

    <g transform="translate(0, 20)">
      <rect width="400" height="175" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
      
      <!-- Metric 1: Total Contributions -->
      <g transform="translate(20, 25)">
        <text class="stat-lbl">TOTAL CONTRIBUTIONS</text>
        <text y="28" class="stat-val" fill="#38bdf8">1,250+</text>
        <text y="48" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Verified Commits &amp; Pull Requests</text>
      </g>

      <line x1="200" y1="20" x2="200" y2="85" stroke="#ffffff" stroke-opacity="0.1"/>

      <!-- Metric 2: Current Streak -->
      <g transform="translate(220, 25)">
        <text class="stat-lbl">CURRENT STREAK</text>
        <text y="28" class="stat-val" fill="#34d399">Active ⚡</text>
        <text y="48" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Daily Automated &amp; Manual Commits</text>
      </g>

      <line x1="20" y1="100" x2="380" y2="100" stroke="#ffffff" stroke-opacity="0.08"/>

      <!-- Metric 3: Longest Streak -->
      <g transform="translate(20, 115)">
        <text class="stat-lbl">LONGEST STREAK</text>
        <text y="26" class="stat-val" fill="#c084fc">45 Days</text>
      </g>

      <line x1="200" y1="110" x2="200" y2="160" stroke="#ffffff" stroke-opacity="0.1"/>

      <!-- Metric 4: Consistency Rate -->
      <g transform="translate(220, 115)">
        <text class="stat-lbl">CONSISTENCY RATE</text>
        <text y="26" class="stat-val" fill="#facc15">94.8%</text>
      </g>
    </g>
  </g>

  <!-- Right Half: Top Languages Spectrum -->
  <g transform="translate(455, 25)">
    <text class="sec-title">📈 MOST USED LANGUAGES</text>

    <g transform="translate(0, 20)">
      <rect width="400" height="175" rx="10" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.08"/>
      
      <g transform="translate(20, 20)">
        <!-- Multi-Color Progress Bar -->
        <rect width="360" height="12" rx="6" fill="#ffffff" fill-opacity="0.05"/>
        <rect width="162" height="12" rx="6" fill="url(#pyGrad)"/>
        <rect x="162" width="90" height="12" fill="url(#cppGrad)"/>
        <rect x="252" width="64" height="12" fill="url(#jsGrad)"/>
        <rect x="316" width="44" height="12" rx="6" fill="url(#tsGrad)"/>

        <!-- Language Breakdown Grid -->
        <g transform="translate(0, 35)">
          <!-- Python -->
          <g transform="translate(0, 0)">
            <circle cx="6" cy="6" r="5" fill="#3b82f6"/>
            <text x="18" y="10" class="lang-txt">Python</text>
            <text x="160" y="10" text-anchor="end" class="lang-pct">45%</text>
          </g>

          <!-- C++ -->
          <g transform="translate(190, 0)">
            <circle cx="6" cy="6" r="5" fill="#ec4899"/>
            <text x="18" y="10" class="lang-txt">C++ / Machine Learning</text>
            <text x="170" y="10" text-anchor="end" class="lang-pct">25%</text>
          </g>

          <!-- JavaScript -->
          <g transform="translate(0, 32)">
            <circle cx="6" cy="6" r="5" fill="#eab308"/>
            <text x="18" y="10" class="lang-txt">JavaScript / Node.js</text>
            <text x="160" y="10" text-anchor="end" class="lang-pct">18%</text>
          </g>

          <!-- TypeScript -->
          <g transform="translate(190, 32)">
            <circle cx="6" cy="6" r="5" fill="#a855f7"/>
            <text x="18" y="10" class="lang-txt">TypeScript / Next.js</text>
            <text x="170" y="10" text-anchor="end" class="lang-pct">12%</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
