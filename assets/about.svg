<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090710"/>
      <stop offset="50%" stop-color="#0e0b1d"/>
      <stop offset="100%" stop-color="#06050b"/>
    </linearGradient>

    <linearGradient id="abBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>

    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      .ab-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 22px; fill: url(#titleGlow); }
      .ab-sub { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; fill: #38bdf8; letter-spacing: 1.5px; }
      .ab-label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; fill: #94a3b8; }
      .ab-val { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 14px; fill: #f3e8ff; }
      .ab-pill { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #e9d5ff; }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="880" height="260" rx="14" fill="url(#abBg)" stroke="url(#abBorder)" stroke-width="1.5"/>

  <!-- Top Terminal Bar -->
  <rect x="0" y="0" width="880" height="42" rx="14" fill="#0d0a18" fill-opacity="0.9"/>
  <line x1="0" y1="42" x2="880" y2="42" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Terminal Controls -->
  <circle cx="20" cy="21" r="4.5" fill="#ef4444"/>
  <circle cx="34" cy="21" r="4.5" fill="#f59e0b"/>
  <circle cx="48" cy="21" r="4.5" fill="#10b981"/>

  <text x="70" y="26" class="ab-sub">PROFILE.SYS // SYED SHAHEER ABBAS</text>
  <text x="855" y="26" text-anchor="end" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#22c55e">● SYSTEM.ONLINE</text>

  <!-- Left Column Info -->
  <g transform="translate(25, 62)">
    <text class="ab-title">SYED SHAHEER ABBAS</text>
    <text y="26" class="ab-sub">AI ENGINEER &amp; FULL STACK DEVELOPER</text>

    <!-- Details Table -->
    <g transform="translate(0, 52)">
      <g transform="translate(0, 0)">
        <text class="ab-label">📍 Location:</text>
        <text x="110" class="ab-val">Pakistan</text>
      </g>
      <g transform="translate(0, 30)">
        <text class="ab-label">🌐 Portfolio:</text>
        <text x="110" class="ab-val" fill="#38bdf8">syedshaheer.netlify.app</text>
      </g>
      <g transform="translate(0, 60)">
        <text class="ab-label">💼 Status:</text>
        <text x="110" class="ab-val" fill="#34d399">Open to AI Engineering &amp; Dev Roles</text>
      </g>
    </g>
  </g>

  <!-- Middle Divider Line -->
  <line x1="430" y1="58" x2="430" y2="235" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- Right Column Summary & Focus -->
  <g transform="translate(455, 65)">
    <text class="ab-label" font-size="15" fill="#f8fafc">💡 CORE SPECIALIZATION &amp; OBJECTIVES</text>
    
    <g transform="translate(0, 30)">
      <text font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">
        Passionate about building production-ready AI applications,
      </text>
      <text y="24" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">
        Computer Vision pipelines, Generative AI models, and
      </text>
      <text y="48" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1">
        scalable full-stack engineering software systems.
      </text>
    </g>

    <!-- Specialization Badges -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="125" height="32" rx="8" fill="url(#tagBg)" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="62.5" y="21" text-anchor="middle" class="ab-pill">Machine Learning</text>

      <rect x="135" y="0" width="125" height="32" rx="8" fill="url(#tagBg)" stroke="#6366f1" stroke-opacity="0.5"/>
      <text x="197.5" y="21" text-anchor="middle" class="ab-pill">Computer Vision</text>

      <rect x="270" y="0" width="130" height="32" rx="8" fill="url(#tagBg)" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="335" y="21" text-anchor="middle" class="ab-pill">Generative AI &amp; LLMs</text>
    </g>
  </g>
</svg>
