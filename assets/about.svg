<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090710"/>
      <stop offset="50%" stop-color="#0e0b1d"/>
      <stop offset="100%" stop-color="#06050b"/>
    </linearGradient>

    <linearGradient id="abBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="titleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .ab-title { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 20px; fill: url(#titleGlow); }
      .ab-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #38bdf8; letter-spacing: 1.5px; }
      .ab-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; fill: #94a3b8; }
      .ab-val { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; fill: #f3e8ff; }
      .ab-pill { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #e9d5ff; }
    </style>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="240" rx="14" fill="url(#abBg)" stroke="url(#abBorder)" stroke-width="1.5"/>

  <!-- Top Terminal Bar -->
  <rect x="0" y="0" width="1200" height="38" rx="14" fill="#0d0a18" fill-opacity="0.8"/>
  <line x1="0" y1="38" x2="1200" y2="38" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Dot Decors -->
  <circle cx="20" cy="19" r="4" fill="#ef4444"/>
  <circle cx="32" cy="19" r="4" fill="#f59e0b"/>
  <circle cx="44" cy="19" r="4" fill="#10b981"/>

  <text x="65" y="23" class="ab-sub">PROFILE.SYS // SYED SHAHEER ABBAS</text>
  <text x="1175" y="23" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22c55e">● SYSTEM.ONLINE</text>

  <!-- Left Column Info -->
  <g transform="translate(30, 60)">
    <text class="ab-title">SYED SHAHEER ABBAS</text>
    <text y="24" class="ab-sub">AI ENGINEER &amp; FULL STACK DEVELOPER</text>

    <!-- Details Table -->
    <g transform="translate(0, 50)">
      <g transform="translate(0, 0)">
        <text class="ab-label">📍 Location:</text>
        <text x="110" class="ab-val">Pakistan</text>
      </g>
      <g transform="translate(0, 26)">
        <text class="ab-label">🌐 Portfolio:</text>
        <text x="110" class="ab-val" fill="#38bdf8">syedshaheer.netlify.app</text>
      </g>
      <g transform="translate(0, 52)">
        <text class="ab-label">💼 Status:</text>
        <text x="110" class="ab-val" fill="#34d399">Open to AI Engineering &amp; Dev Roles</text>
      </g>
    </g>
  </g>

  <!-- Middle Divider Line -->
  <line x1="550" y1="55" x2="550" y2="215" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Right Column Summary & Focus -->
  <g transform="translate(580, 60)">
    <text class="ab-label" font-size="14" fill="#f8fafc">💡 CORE SPECIALIZATION &amp; OBJECTIVES</text>
    
    <g transform="translate(0, 25)">
      <text font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" width="580">
        Passionate about building production-ready AI applications, Computer Vision pipelines,
      </text>
      <text y="20" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1">
        LLM architectures, and scalable full-stack software systems.
      </text>
    </g>

    <!-- Tech Specialization Badges -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="170" height="28" rx="6" fill="url(#tagBg)" stroke="#a855f7" stroke-opacity="0.4"/>
      <text x="85" y="18" text-anchor="middle" class="ab-pill">Machine Learning</text>

      <rect x="180" y="0" width="170" height="28" rx="6" fill="url(#tagBg)" stroke="#6366f1" stroke-opacity="0.4"/>
      <text x="265" y="18" text-anchor="middle" class="ab-pill">Computer Vision</text>

      <rect x="360" y="0" width="180" height="28" rx="6" fill="url(#tagBg)" stroke="#38bdf8" stroke-opacity="0.4"/>
      <text x="450" y="18" text-anchor="middle" class="ab-pill">Generative AI &amp; LLMs</text>
    </g>
  </g>
</svg>
