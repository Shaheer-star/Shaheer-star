<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070d"/>
      <stop offset="50%" stop-color="#0f0c1b"/>
      <stop offset="100%" stop-color="#050409"/>
    </linearGradient>

    <!-- Glow Orbs -->
    <radialGradient id="purpleGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 56px; letter-spacing: 4px; }
      .subtitle { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 6px; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; letter-spacing: 1.5px; }
      .code-text { font-family: 'JetBrains Mono', monospace; font-weight: 400; font-size: 13px; fill: #94a3b8; }
      .pulse-node { animation: pulse 3s infinite alternate ease-in-out; }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.9; transform: scale(1.02); }
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1600" height="500" fill="url(#bgGrad)"/>
  
  <!-- Glowing Background Orbs -->
  <circle cx="300" cy="150" r="350" fill="url(#purpleGlow)"/>
  <circle cx="1300" cy="350" r="400" fill="url(#indigoGlow)"/>
  <circle cx="800" cy="250" r="300" fill="url(#cyanGlow)"/>

  <!-- Tech Grid Overlay -->
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Neural Network Connections (Abstract AI Visuals - Left & Right Background) -->
  <g opacity="0.4">
    <!-- Left Neural Cluster -->
    <path d="M 100 120 L 220 80 L 340 180 L 200 280 L 100 120 Z" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 220 80 L 450 120 L 340 180 M 200 280 L 380 320 L 450 120" fill="none" stroke="#6366f1" stroke-width="1"/>
    <circle cx="100" cy="120" r="4" fill="#a855f7"/>
    <circle cx="220" cy="80" r="6" fill="#c084fc"/>
    <circle cx="340" cy="180" r="5" fill="#818cf8"/>
    <circle cx="200" cy="280" r="4" fill="#38bdf8"/>
    <circle cx="450" cy="120" r="6" fill="#a855f7"/>
    <circle cx="380" cy="320" r="4" fill="#6366f1"/>

    <!-- Right Neural Cluster -->
    <path d="M 1250 150 L 1380 90 L 1500 200 L 1400 350 L 1250 150 Z" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6 6"/>
    <path d="M 1380 90 L 1180 220 L 1400 350 M 1500 200 L 1280 400" fill="none" stroke="#a855f7" stroke-width="1"/>
    <circle cx="1250" cy="150" r="5" fill="#38bdf8"/>
    <circle cx="1380" cy="90" r="7" fill="#a855f7"/>
    <circle cx="1500" cy="200" r="4" fill="#c084fc"/>
    <circle cx="1400" cy="350" r="6" fill="#818cf8"/>
    <circle cx="1180" cy="220" r="4" fill="#a855f7"/>
    <circle cx="1280" cy="400" r="5" fill="#6366f1"/>
  </g>

  <!-- Glowing Accent Lines Top & Bottom -->
  <rect x="0" y="0" width="1600" height="2" fill="url(#borderGrad)"/>
  <rect x="0" y="498" width="1600" height="2" fill="url(#borderGrad)"/>

  <!-- Main Glassmorphism Card Container -->
  <g filter="url(#dropShadow)">
    <rect x="180" y="70" width="1240" height="360" rx="20" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <rect x="181" y="71" width="1238" height="358" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  </g>

  <!-- Terminal Dot Decorative Header on Card -->
  <circle cx="220" cy="105" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="236" cy="105" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="252" cy="105" r="5" fill="#10b981" opacity="0.8"/>
  <text x="275" y="109" class="code-text">shaheer-star / profile.ai</text>

  <!-- Card Divider Line -->
  <line x1="210" y1="125" x2="1390" y2="125" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Center Content Block -->
  <!-- Status Badge -->
  <g transform="translate(650, 150)">
    <rect x="0" y="0" width="300" height="32" rx="16" fill="url(#badgeGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="21" class="badge-text" fill="#e9d5ff">SYSTEM.STATUS: ACTIVE // AI_ENG</text>
  </g>

  <!-- Main Name Title -->
  <text x="800" y="245" text-anchor="middle" class="title" fill="url(#titleGrad)">SYED SHAHEER ABBAS</text>

  <!-- Role Subtitle -->
  <text x="800" y="295" text-anchor="middle" class="subtitle" fill="url(#subGrad)">AI ENGINEER</text>

  <!-- Tech Focus Badges -->
  <g transform="translate(355, 335)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="38" rx="8" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>
      <text x="105" y="24" text-anchor="middle" class="badge-text" fill="#c7d2fe">MACHINE LEARNING</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(225, 0)">
      <rect width="210" height="38" rx="8" fill="#2e1065" fill-opacity="0.6" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1"/>
      <text x="105" y="24" text-anchor="middle" class="badge-text" fill="#e9d5ff">COMPUTER VISION</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(450, 0)">
      <rect width="210" height="38" rx="8" fill="#030712" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <text x="105" y="24" text-anchor="middle" class="badge-text" fill="#bae6fd">FULL STACK DEV</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(675, 0)">
      <rect width="215" height="38" rx="8" fill="#18181b" fill-opacity="0.6" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
      <text x="107.5" y="24" text-anchor="middle" class="badge-text" fill="#fbcfe8">GENERATIVE AI</text>
    </g>
  </g>

  <!-- Geometric Corner Accent Decors -->
  <path d="M 195 85 L 195 75 L 205 75" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 1405 85 L 1405 75 L 1395 75" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 195 415 L 195 425 L 205 425" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 1405 415 L 1405 425 L 1395 425" fill="none" stroke="#a855f7" stroke-width="2"/>
</svg>
